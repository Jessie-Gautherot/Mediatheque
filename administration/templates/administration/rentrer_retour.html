{% extends "base.html" %}

{% block content %}
<h1>Retour de médias</h1>

<form method="get" action="{% url 'retourner_media' %}">
    <label for="membre_id">Choisir un membre :</label>
    <select name="membre_id" id="membre_id" required>
        <option value="">-- Sélectionnez un membre --</option>

        {% for membre in membres %}
            <option value="{{ membre.id }}">{{ membre }}</option>
        {% endfor %}
    </select>

    <button type="submit">Voir ses emprunts</button>
</form>


{% if emprunts %}
    <h2>Emprunts actifs</h2>

    <form method="post" action="{% url 'valider_retour_multi' %}">
        {% csrf_token %}

        <input type="hidden" name="membre_id" value="{{ membre_id }}">

        <ul>
            {% for emprunt in emprunts %}
                <li>
                    <label>
                        <input type="checkbox" name="emprunt_ids" value="{{ emprunt.id }}">
                        {{ emprunt.media }} — emprunté le {{ emprunt.date_emprunt }}
                    </label>
                </li>
            {% endfor %}
        </ul>

        <button type="submit">Enregistrer le retour</button>
    </form>
{% endif %}

<p>
    <a href="{% url 'administration_home' %}">Retour à l'espace administration</a>
</p>

{% endblock %}
