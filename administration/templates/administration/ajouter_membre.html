{% extends "base.html" %}

{% block content %}

<h1>Ajouter un membre</h1>

{% if messages %}
<ul>
{% for message in messages %}
    <li>{{ message }}</li>
{% endfor %}
</ul>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Ajouter le membre</button>
</form>

<p>
    <a href="{% url 'administration_home' %}">Retour à l'espace administration</a>
</p>

{% endblock %}
