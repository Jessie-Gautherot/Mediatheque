{% extends "base.html" %}

{% block content %}

    <h1>Ajouter un {{ type_media }}</h1>

{% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>
        {{ message }}
    </li>
    {% endfor %}
</ul>
{% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Enregistrer</button>
    </form>

    <p>
    <a href="{% url 'administration_home' %}">Retour à l'espace administration</a>
    </p>

{% endblock %}
